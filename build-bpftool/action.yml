name: 'Test bpftool build'
description: 'Run test_bpftool_build.sh to exercise the various ways of building bpftool'
inputs:
  kernel-root:
    description: 'Path to the root of the kernel source tree'
    required: true
  max-make-jobs:
    description: 'Maximum number of jobs to use when running make (e.g argument to -j). Default: 4*nproc'
    default: ''

runs:
  using: "composite"
  steps:
    - name: Test bpftool build
      shell: bash
      run: |
        ${GITHUB_ACTION_PATH}/build_bpftool.sh \
          "${{ inputs.kernel-root }}"
      env:
        MAX_MAKE_JOBS: ${{ inputs.max-make-jobs }}
